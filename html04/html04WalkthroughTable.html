<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>

    <style>
        table, th, td { border: 2px solid #150036; border-collapse: collapse; }
        th, td { padding: 5px }
        th { background-color: lightcoral}
    </style>
</head>
<body>
    
    <main>

        <h1>Lunch Menu</h1>

        <table>
            <caption>Weekly Lunch Menu</caption>
            <tr>
                <th>Day</th>
                <th>Main</th>
                <th>Side</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>Pizza</td>
                <td>Salad</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>Tacos</td>
                <td>Rice</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>Hamburger</td>
                <td>Tater Tots</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>Chili</td>
                <td>Cornbread</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td colspan="2">No School - Holiday</td>
            </tr>
        </table>

    </main>

</body>
</html>
